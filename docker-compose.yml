# Docker Compose configuration for multi-service Amica application.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amica-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "3001:3001"  # MCP server port
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3001}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - WORKSPACES_DIR=/app/workspaces
      - DATABASE_PATH=/app/data/amica.db
    volumes:
      - amica_workspaces:/app/workspaces
      - amica_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    container_name: amica-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  amica_workspaces:
  amica_data:
